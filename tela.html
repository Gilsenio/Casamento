<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💍 Nosso Casamento</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Georgia', 'Times New Roman', serif;
        background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Tela de Boas-Vindas */
      .welcome-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(212, 82, 110, 0.95) 0%,
          rgba(184, 64, 94, 0.95) 100%
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeIn 0.5s ease;
      }

      .welcome-screen.hidden {
        display: none;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .welcome-content {
        text-align: center;
        color: white;
        padding: 40px;
      }

      .welcome-rings {
        font-size: 100px;
        margin-bottom: 30px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .welcome-content h1 {
        font-size: 48px;
        margin-bottom: 20px;
        letter-spacing: 3px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .welcome-content .names {
        font-size: 32px;
        font-style: italic;
        margin: 15px 0;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .welcome-content p {
        font-size: 18px;
        margin: 20px 0 40px;
        opacity: 0.9;
      }

      .enter-button {
        background: white;
        color: #d4526e;
        border: none;
        padding: 20px 60px;
        font-size: 24px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        transition: all 0.3s;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .enter-button:hover {
        transform: scale(1.1);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      }

      .music-note {
        font-size: 20px;
        margin-left: 10px;
        display: inline-block;
        animation: musicNote 1s ease-in-out infinite;
      }

      @keyframes musicNote {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      /* Conteúdo Principal (oculto inicialmente) */
      .main-content {
        display: none;
        width: 100%;
        max-width: 600px;
        background: white;
        border-radius: 30px;
        padding: 50px 40px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
      }

      .main-content.active {
        display: block;
        animation: slideUp 0.8s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        color: #d4526e;
        font-size: 36px;
        margin-bottom: 10px;
      }

      .header p {
        color: #666;
        font-size: 16px;
      }

      /* Controle de Música */
      .music-control {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1000;
        background: linear-gradient(135deg, #d4526e 0%, #b8405e 100%);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(212, 82, 110, 0.4);
        transition: all 0.3s;
      }

      .music-control:hover {
        transform: scale(1.1);
      }

      .music-control span {
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <!-- Tela de Boas-Vindas -->
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-content">
        <div class="welcome-rings">💍</div>
        <h1>Bem-vindo(a)!</h1>
        <div class="names">Anilda & António</div>
        <p>Você está convidado(a) para o nosso casamento</p>
        <button class="enter-button" onclick="enterSite()">
          Entrar
          <span class="music-note">🎵</span>
        </button>
        <p style="font-size: 14px; margin-top: 20px; opacity: 0.8">
          *A música será iniciada ao clicar
        </p>
      </div>
    </div>

    <!-- Controle de Música -->
    <div
      class="music-control"
      id="music-control"
      onclick="toggleMusic()"
      style="display: none"
    >
      <span id="music-icon">🔇</span>
    </div>

    <!-- Audio Player -->
    <audio id="background-music" loop>
      <source
        src="https://www.dropbox.com/scl/fi/fyg9h4pmq2l93j0b6jqw0/Ed-Sheeran-Thinking-Out-Loud-Official-Music-Video.mp3?rlkey=m0fktn9hx6hnp7bjf9lo0q5g3&st=fdg22ekc&dl=1"
        type="audio/mpeg"
      />
    </audio>

    <!-- Conteúdo Principal -->
    <div class="main-content" id="main-content">
      <div class="header">
        <h1>💍 Nosso Casamento</h1>
        <p>Confirme sua presença no nosso grande dia!</p>
      </div>

      <div
        style="
          padding: 30px;
          background: #f8f9fa;
          border-radius: 15px;
          text-align: center;
        "
      >
        <p style="font-size: 18px; color: #666">
          ✅ Você entrou no site!<br /><br />
          A música está tocando ao fundo 🎵
        </p>
      </div>
    </div>

    <script>
      let musicPlaying = false;

      function enterSite() {
        // Ocultar tela de boas-vindas
        document.getElementById('welcome-screen').classList.add('hidden');

        // Mostrar conteúdo principal
        document.getElementById('main-content').classList.add('active');

        // Mostrar controle de música
        document.getElementById('music-control').style.display = 'flex';

        // INICIAR MÚSICA AUTOMATICAMENTE (funciona porque usuário clicou!)
        const audio = document.getElementById('background-music');
        audio
          .play()
          .then(() => {
            console.log('✅ Música iniciada com sucesso!');
            document.getElementById('music-icon').textContent = '🔇';
            musicPlaying = true;
          })
          .catch((e) => {
            console.log('❌ Erro ao tocar música:', e);
          });
      }

      function toggleMusic() {
        const audio = document.getElementById('background-music');
        const icon = document.getElementById('music-icon');

        if (musicPlaying) {
          audio.pause();
          icon.textContent = '🎵';
          musicPlaying = false;
        } else {
          audio
            .play()
            .then(() => {
              icon.textContent = '🔇';
              musicPlaying = true;
            })
            .catch((e) => console.log('Erro ao tocar música:', e));
        }
      }
    </script>
  </body>
</html>
